<body>
<div class="header" id="mainHeader">
  <h1>春凯电器 · 产品规格书 V5</h1>
  <div class="stats" id="headerStats">加载中...</div>
  <div class="actions">
    <button class="btn btn-success btn-sm" onclick="saveToFile()">💾 保存到本文件</button>
    <button class="btn btn-outline btn-sm" onclick="exportFullHtml()">导出完整备份HTML(含修改和图)</button>
    <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">导入JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-outline btn-sm" onclick="resetData()">重置数据</button>
  </div>
</div>

<div class="container" id="mainContainer">
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="快速搜索：产品名称 / 型号 / 备注 / 系列">
    <input type="text" id="searchAllInput" placeholder="全字段搜索：所有参数（电压/功率/装柜量/电机…）">
    <select id="seriesFilter"><option value="">全部系列</option></select>
    <select id="perPageSelect">
      <option value="20">20条/页</option>
      <option value="50" selected>50条/页</option>
      <option value="100">100条/页</option>
      <option value="200">200条/页</option>
    </select>
    <button class="btn btn-primary" onclick="openCreateModal()">+ 新增产品</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('id')">ID</th>
          <th>图片</th>
          <th onclick="sortBy('series')">系列</th>
          <th onclick="sortBy('product_name')">产品名称</th>
          <th onclick="sortBy('model')">型号</th>
          <th>电压</th>
          <th>功率</th>
          <th>净重</th>
          <th>装柜量(40HQ)</th>
          <th onclick="sortBy('product_size')">产品尺寸</th>
          <th onclick="sortBy('motor_info')">电机信息</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">产品详情</h2>
      <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('detailModal')">关闭</button>
      <button class="btn btn-primary" onclick="editFromDetail()">编辑</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="editTitle">编辑产品</h2>
      <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="editForm" class="form-grid"></form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('editModal')">取消</button>
      <button class="btn btn-success" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

// ---- IndexedDB（全量持久化，容量远大于 localStorage）----
let idbDB=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(idbDB) return res(idbDB);
    const req=indexedDB.open('chukai_specs_v4',1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
    req.onsuccess=()=>{ idbDB=req.result; res(idbDB); };
    req.onerror=()=>rej(req.error);
  });
}
async function idbSet(key,val){
  const db=await idbOpen();
  return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(val,key); t.oncomplete=res; t.onerror=()=>rej(t.error); });
}
async function idbGet(key){
  try{ const db=await idbOpen();
    return new Promise((res,rej)=>{ const r=db.transaction('kv').objectStore('kv').get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  }catch(e){ return undefined; }
}
async function idbDel(key){
  try{ const db=await idbOpen();
    return new Promise((res)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').delete(key); t.oncomplete=res; t.onerror=res; });
  }catch(e){}
}
// ---- 保存到本文件（File System Access API 直写 / IndexedDB 兜底 / 导出兜底）----
function serializeProducts(){
  return JSON.stringify(products).replace(/<\//g,'<\\/');
}
function replaceDataLine(html, enc){
  // 替换 const EMBEDDED_DATA = {...}; 整行（m 标志，行首行尾锚定）
  return html.replace(/^const EMBEDDED_DATA = .*?;\s*$/m, 'const EMBEDDED_DATA = '+enc+';');
}
async function saveToFile(){
  if(!requireEditAuth()) return;
  toast('正在打包（含全部图片，请稍候）...','info');
  await new Promise(r=>setTimeout(r,50));
  try{
    const enc=serializeProducts();
    const base=window.__BASELINE_HTML||('<!DOCTYPE html>\n'+document.documentElement.outerHTML);
    const html=replaceDataLine(base, enc);
    // 1) File System Access API 直写
    if(window.showSaveFilePicker){
      try{
        if(!fileHandle||fileHandle.queryPermission){ 
          const perm=fileHandle?(await fileHandle.queryPermission({mode:'readwrite'})):'denied';
          if(!fileHandle||perm!=='granted'){
            fileHandle=await window.showSaveFilePicker({
              suggestedName:'春凯产品规格书管理系统.html',
              types:[{description:'HTML',accept:{'text/html':['.html']}}]
            });
            try{ await idbSet('fileHandle',fileHandle); }catch(e){}
          }
        }
        const w=await fileHandle.createWritable();
        await w.write(html); await w.close();
        await idbSet('products',{products,nextId}); 
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
        baseline=JSON.parse(JSON.stringify(products));
        toast('已保存到本文件（含全部修改与图片），可直接发给同事','success'); return;
      }catch(e){
        if(e.name==='AbortError'){ toast('已取消保存','info'); return; }
        console.warn('直写失败，转存浏览器本地',e);
        try{ await idbSet('products',{products,nextId}); }catch(e2){}
        saveChanges();
        toast('当前浏览器无法直接写文件，改动已存入浏览器本地；可点"导出完整备份HTML"生成新文件','info'); return;
      }
    }
    // 2) 无 API：IndexedDB + 导出
    try{ await idbSet('products',{products,nextId}); }catch(e){}
    saveChanges();
    toast('当前浏览器不支持直写文件，已存浏览器本地，请点"导出完整备份HTML"','info');
  }catch(e){ console.error(e); toast('保存失败：'+e.message,'error'); }
}
async function exportFullHtml(){
  toast('正在打包（含全部图片，请稍候）...','info');
  await new Promise(r=>setTimeout(r,50));
  try{
    const enc=serializeProducts();
    const base=window.__BASELINE_HTML||('<!DOCTYPE html>\n'+document.documentElement.outerHTML);
    const html=replaceDataLine(base, enc);
    const blob=new Blob([html],{type:'text/html'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='春凯规格书_含修改_'+new Date().toISOString().slice(0,10)+'.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('已导出完整HTML，把这个文件发给同事即可看到全部修改和图');
  }catch(e){ console.error(e); toast('导出失败：'+e.message,'error'); }
}

function requireEditAuth() {
  if (editable) return true;
  const p = prompt('编辑密码：');
  if (p === EDIT_PASSWORD) { sessionStorage.setItem('chukai_editable','1'); editable = true; toast('已解锁编辑'); return true; }
  if (p !== null) toast('密码错误','error');
  return false;
}

let state = { page:1, per_page:50, search:'', searchAll:'', series:'', sort:'source_tag', order:'asc', currentId:null };
async function init() {
  try {
    products = JSON.parse(JSON.stringify(EMBEDDED_DATA));
    nextId = Math.max(...products.map(p=>p.id||0), 0) + 1;
    baseline = JSON.parse(JSON.stringify(products));
    window.__BASELINE_HTML='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    // 恢复：IndexedDB 全量优先，localStorage diff 次之
    const full = await idbGet('products');
    if (full && full.products && Array.isArray(full.products)) { products = full.products; nextId = full.nextId || nextId; }
    else {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const ch = JSON.parse(saved);
          if (ch.updates) for (const id in ch.updates) {
            let p = products.find(x=>String(x.id)===String(id));
            if (p) Object.assign(p, ch.updates[id]);
            else products.push(Object.assign({id:Number(id)}, ch.updates[id]));
          }
          if (ch.imgChanges) for (const id in ch.imgChanges) {
            const p = products.find(x=>String(x.id)===String(id));
            if (p) p.image = ch.imgChanges[id];
          }
          if (Array.isArray(ch.deleted)) products = products.filter(p=>!ch.deleted.includes(p.id));
          if (ch.nextId) nextId = ch.nextId;
        }
      } catch(e) {}
    }
    try { const h = await idbGet('fileHandle'); if (h && h.queryPermission) fileHandle = h; } catch(e) {}
    buildChildMap();
    renderSeriesFilter();
    renderTable();
    updateStats();
  } catch(e) {
    document.getElementById('headerStats').innerHTML = '<span style="color:#ff6b6b">加载失败: '+e.message+'</span>';
    console.error(e);
  }
}
init();
function buildChildMap() {
  childMap = {};
  products.forEach(p => {
    if (p.group_model && p.is_main === false) {
      if (!childMap[p.group_model]) childMap[p.group_model] = [];
      childMap[p.group_model].push(p);
    }
  });
  Object.keys(childMap).forEach(k => childMap[k].sort((a,b)=> (b.comp||0)-(a.comp||0) || a.id-b.id));
}

function saveChanges() {
  try {
    const updates = {}, imgChanges = {};
    const bById = {}; (baseline||[]).forEach(p=>bById[p.id]=p);
    products.forEach(p => {
      const b = bById[p.id];
      if (!b) { updates[p.id] = p; imgChanges[p.id] = p.image; return; }
      const diff = {};
      for (const k in p) {
        if (k === 'image' || k === 'alt_images') continue;
        if (JSON.stringify(p[k]) !== JSON.stringify(b[k])) diff[k] = p[k];
      }
      if (Object.keys(diff).length) updates[p.id] = diff;
      if (p.image !== b.image) imgChanges[p.id] = p.image;
    });
    const curIds = new Set(products.map(p=>p.id));
    const deleted = (baseline||[]).filter(p=>!curIds.has(p.id)).map(p=>p.id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify({updates, imgChanges, deleted, nextId, timestamp:new Date().toISOString()}));
  } catch(e) {
    toast('保存失败：浏览器存储空间不足。请点右上角"导出完整备份HTML"，本机文字修改已暂存、图片修改导出时仍在。','error');
  }
}
function getSeriesList() { const s = new Set(); products.forEach(p=>{if(p.series)s.add(p.series);}); return Array.from(s).sort(); }

function toast(msg, type='success') {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2500);
}
function esc(s) { if(s===null||s===undefined) return ''; const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }
function updateStats() {
  const sc = new Set(products.map(p=>p.series).filter(Boolean)).size;
  const mainN = products.filter(p=>p.is_main!==false).length;
  const hc = localStorage.getItem(STORAGE_KEY) !== null;
  document.getElementById('headerStats').innerHTML =
    `共 ${mainN} 个型号` + (products.length!==mainN?`（展开 ${products.length} 条）`:'') + ` · ${sc} 个系列` + (hc?'<span class="badge">已修改</span>':'');
}
function renderSeriesFilter() {
  const sel = document.getElementById('seriesFilter'); const cur = sel.value;
  sel.innerHTML = '<option value="">全部系列</option>' + getSeriesList().map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  sel.value = cur;
}
function getFiltered() {
  let list = products.slice();
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(p => (p.product_name||'').toLowerCase().includes(q) ||
      (p.model||'').toLowerCase().includes(q) || (p.remark||'').toLowerCase().includes(q) ||
      (p.series||'').toLowerCase().includes(q));
  }
  if (state.searchAll) {
    const q = state.searchAll.toLowerCase();
    list = list.filter(p => {
      for (const k in p) {
        if (k==='image'||k==='alt_images'||k==='extra_fields') continue;
        const v = p[k];
        if (v!==undefined && v!==null && String(v).toLowerCase().includes(q)) return true;
      }
      const ef = p.extra_fields||{};
      for (const k in ef) {
        if (String(ef[k]).toLowerCase().includes(q) || String(k).toLowerCase().includes(q)) return true;
      }
      return false;
    });
  }
  if (state.series) list = list.filter(p=>p.series===state.series);
  const col = state.sort;
  const tagW = {'':0,'新':1,'旧':2};
  list.sort((a,b)=>{
    if (col==='source_tag') {
      const wa=tagW[a.source_tag||'']??0, wb=tagW[b.source_tag||'']??0;
      if (wa!==wb) return wa-wb;
      return (Number(a.id)||0)-(Number(b.id)||0);
    }
    let va=a[col]||'', vb=b[col]||'';
    if (col==='id') { va=Number(va)||0; vb=Number(vb)||0; }
    if (va<vb) return state.order==='asc'?-1:1;
    if (va>vb) return state.order==='asc'?1:-1;
    return 0;
  });
  return list;
}

function rowHtml(p, isChild) {
  const prefix = isChild ? '<span class="child-prefix">└</span>' : '';
  const grpBtn = (!isChild && p.group_model && p.group_size>1)
    ? `<span class="group-btn" onclick="toggleGroup('${esc(p.group_model)}')">${expandedGroups.has(p.group_model)?'收起':'同型号×'+p.group_size}</span>` : '';
  const thumb = p.image
    ? `<div class="img-wrap">${p.img_placeholder?'<span class="img-badge">暂无产品图</span>':''}<img class="thumb" loading="lazy" src="${esc(p.image)}" onclick="viewDetail(${p.id})" onerror="this.outerHTML='<div class=thumb-empty>无</div>'"></div>`
    : '<div class="thumb-empty">无</div>';
  return `<tr class="${isChild?'child-row':''}">
    <td>${p.id}</td>
    <td>${isChild?'':thumb}</td>
    <td>${isChild?'':`<span class="series-tag">${esc(p.series||'')}</span>`}</td>
    <td>${prefix}${esc(p.product_name||'')}${p.source_tag?`<span class="tag tag-${p.source_tag==='旧'?'old':'new'}">${p.source_tag}</span>`:''}${grpBtn}
      <div class="source-file">${esc(p.source_file||'')}</div></td>
    <td class="model-cell">${esc(p.model||'')}</td>
    <td>${esc(p.voltage||'')}</td>
    <td>${esc(p.power||'')}</td>
    <td>${esc(p.net_weight||'')}</td>
    <td>${esc(p.container_40hq||'')}</td>
    <td class="cell-size">${esc(p.product_size||'')}</td>
    <td class="cell-motor">${esc(p.motor_info||'')}</td>
    <td class="actions-cell">
      <button class="btn btn-outline btn-sm" onclick="viewDetail(${p.id})">查看</button>
      <button class="btn btn-primary btn-sm" onclick="openEditModal(${p.id})">编辑</button>
      <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">删除</button>
    </td>
  </tr>`;
}

function renderTable() {
  const filtered = getFiltered();
  const mains = filtered.filter(p=>p.is_main!==false);
  const total = mains.length;
  const pages = Math.ceil(total/state.per_page);
  if (state.page>pages && pages>0) state.page=pages;
  const start=(state.page-1)*state.per_page;
  const pageMains=mains.slice(start,start+state.per_page);
  const tbody=document.getElementById('tableBody');
  if (pageMains.length===0) { tbody.innerHTML='<tr><td colspan="12" class="empty">暂无数据</td></tr>'; }
  else {
    let html='';
    pageMains.forEach(m=>{
      html += rowHtml(m,false);
      if (m.group_model && expandedGroups.has(m.group_model)) {
        (childMap[m.group_model]||[]).forEach(c=>{ html+=rowHtml(c,true); });
      }
    });
    tbody.innerHTML=html;
  }
  renderPagination(total,pages);
}
function toggleGroup(gm) {
  if (expandedGroups.has(gm)) expandedGroups.delete(gm); else expandedGroups.add(gm);
  renderTable();
}
function renderPagination(total,pages) {
  const el=document.getElementById('pagination');
  let html=`<span class="info">共 ${total} 个型号，第 ${state.page}/${pages||1} 页</span>`;
  html+=`<button onclick="goPage(1)" ${state.page<=1?'disabled':''}>首页</button>`;
  html+=`<button onclick="goPage(${state.page-1})" ${state.page<=1?'disabled':''}>上一页</button>`;
  const s=Math.max(1,state.page-3), e=Math.min(pages,state.page+3);
  for(let i=s;i<=e;i++) html+=`<button class="${i===state.page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  html+=`<button onclick="goPage(${state.page+1})" ${state.page>=pages?'disabled':''}>下一页</button>`;
  html+=`<button onclick="goPage(${pages})" ${state.page>=pages?'disabled':''}>末页</button>`;
  el.innerHTML=html;
}
function goPage(p){state.page=p;renderTable();}
function sortBy(col){ if(state.sort===col) state.order=state.order==='asc'?'desc':'asc'; else {state.sort=col;state.order='asc';} renderTable(); }

function viewDetail(id) {
  const p=products.find(x=>x.id===id); if(!p)return;
  state.currentId=id;
  document.getElementById('detailTitle').innerHTML=`${esc(p.product_name||'产品详情')}${p.source_tag?`<span class="tag tag-${p.source_tag==='旧'?'old':'new'}">${p.source_tag}</span>`:''}`;
  const sections=[
    {title:'基本信息',fields:['series','product_name','model','voltage','speed_levels','power','rpm','wind_speed','noise','temperature_rise','timer','operation_mode','oscillation_angle','tilt_angle','color']},
    {title:'尺寸与重量',fields:['product_size','package_size','carton_size','net_weight','gross_weight']},
    {title:'装柜与配件（含20GP/40GP）',fields:['container_40hq','container_40gp','container_20gp','motor','motor_info','blade','max_airflow','standby_power','charge_time','discharge_time','battery']},
    {title:'认证信息',fields:['cert_ce','cert_cb','cert_gs','cert_saa','cert_ul','cert_etl','cert_rohs','cert_other']},
  ];
  let html='';
  if(p.image) html+=`<div class="detail-img-wrap">${p.img_placeholder?'<span class="img-badge">暂无产品图（商标占位）</span>':''}<img class="detail-img" loading="lazy" src="${esc(p.image)}" onclick="window.open(this.src)" onerror="this.outerHTML='<div class=img-placeholder>图片不存在</div>'"></div>`;
  else html+='<div class="img-placeholder">暂无图片</div>';
  sections.forEach(sec=>{
    const items=sec.fields.filter(f=>{const v=p[f];return v!==undefined&&v!==null&&v!=='';});
    if(items.length){
      html+=`<div class="section-title">${sec.title}</div><div class="detail-grid">`;
      items.forEach(f=>{html+=`<div class="detail-item"><div class="label">${FIELD_LABELS[f]||f}</div><div class="value">${esc(p[f])}</div></div>`;});
      html+='</div>';
    }
  });
  if(p.remark) html+=`<div class="section-title">备注</div><div style="padding:10px 14px;font-size:14px;line-height:1.6">${esc(p.remark)}</div>`;
  if(p.extra_fields&&Object.keys(p.extra_fields).length){
    html+='<div class="section-title">其他字段</div><div class="detail-grid">';
    Object.entries(p.extra_fields).forEach(([k,v])=>{if(v)html+=`<div class="detail-item"><div class="label">${esc(k)}</div><div class="value">${esc(v)}</div></div>`;});
    html+='</div>';
  }
  html+=`<div class="section-title">元数据</div><div class="detail-grid">
    <div class="detail-item"><div class="label">来源文件</div><div class="value">${esc(p.source_file||'')}</div></div>
    <div class="detail-item"><div class="label">更新时间</div><div class="value">${esc(p.updated_at||'')}</div></div></div>`;
  document.getElementById('detailBody').innerHTML=html;
  document.getElementById('detailModal').classList.add('active');
}
function editFromDetail(){closeModal('detailModal');openEditModal(state.currentId);}

function buildForm() {
  const form=document.getElementById('editForm');
  const imgPick=`<div class="form-group full">
    <label>产品图片</label>
    <div class="edit-img-box" id="editImgBox"><span class="ph">暂无图片</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn btn-outline btn-sm" onclick="togglePickList()">从候选图选择</button>
      <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('uploadImgInput').click()">上传本地图片</button>
      <button type="button" class="btn btn-outline btn-sm" onclick="clearMainImg()">清除图片</button>
      <input type="file" id="uploadImgInput" accept="image/*" style="display:none" onchange="uploadLocalImg(event)">
    </div>
    <div style="font-size:11px;color:#999;margin-top:4px">支持 Ctrl+V 直接粘贴截图</div>
    <div id="pickList" class="pick-grid" style="display:none;margin-top:10px"></div>
  </div>`;
  form.innerHTML=imgPick+EDIT_FIELDS.map(f=>{
    const label=FIELD_LABELS[f]||f;
    if(f==='series'){
      const sl=getSeriesList();
      return `<div class="form-group"><label>${label}</label><select name="series"><option value="">请选择</option>${sl.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>`;
    }
    if(f==='remark') return `<div class="form-group full"><label>${label}</label><textarea name="${f}"></textarea></div>`;
    return `<div class="form-group"><label>${label}</label><input type="text" name="${f}"></div>`;
  }).join('')+`<div class="form-group full"><label>来源文件</label><input type="text" name="source_file"></div>`;
}
let editImgSrc='';
function renderEditImg(){
  const box=document.getElementById('editImgBox');
  box.innerHTML = editImgSrc ? `<img src="${esc(editImgSrc)}">` : '<span class="ph">暂无图片</span>';
}
function togglePickList(){
  const el=document.getElementById('pickList');
  if(el.style.display==='none'){
    const p=state.currentId?products.find(x=>x.id===state.currentId):null;
    let cands=[];
    if(p){ cands=(p.alt_images||[]).slice(); if(p.image&&!cands.includes(p.image))cands.unshift(p.image); }
    if(!cands.length){ toast('该产品暂无候选图，请用上传本地图片','info'); return; }
    el.innerHTML=cands.map(c=>`<div class="pick-cell ${c===editImgSrc?'sel':''}" onclick="pickImg(this,'${c}')"><img src="${esc(c)}"></div>`).join('');
    el.style.display='grid';
  } else el.style.display='none';
}
function pickImg(cell,src){ editImgSrc=src; renderEditImg();
  document.querySelectorAll('#pickList .pick-cell').forEach(c=>c.classList.remove('sel')); cell.classList.add('sel'); }
function clearMainImg(){ editImgSrc=''; renderEditImg();
  document.querySelectorAll('#pickList .pick-cell').forEach(c=>c.classList.remove('sel')); }
function uploadLocalImg(ev){
  const f=ev.target.files[0]; if(!f)return;
  if(f.size>6*1024*1024){ toast('图片过大，请选小于6MB的图片','error'); return; }
  const rd=new FileReader();
  rd.onload=function(e){ editImgSrc=e.target.result; renderEditImg();
    document.getElementById('pickList').style.display='none'; toast('已载入图片，记得点保存'); };
  rd.readAsDataURL(f); ev.target.value='';
}
document.addEventListener('paste',e=>{
  if(!document.getElementById('editModal').classList.contains('active')) return;
  const items=e.clipboardData&&e.clipboardData.items; if(!items)return;
  for(const it of items){
    if(it.type.indexOf('image/')===0){
      const f=it.getAsFile(); if(!f)continue;
      const rd=new FileReader();
      rd.onload=ev=>{ editImgSrc=ev.target.result; renderEditImg();
        document.getElementById('pickList').style.display='none'; toast('已粘贴图片，记得点保存'); };
      rd.readAsDataURL(f); break;
    }
  }
});
function openEditModal(id) {
  if(!requireEditAuth()) return;
  state.currentId=id; document.getElementById('editTitle').textContent='编辑产品'; buildForm();
  const p=products.find(x=>x.id===id); const form=document.getElementById('editForm');
  if(p){ EDIT_FIELDS.forEach(f=>{const el=form.querySelector(`[name="${f}"]`);if(el)el.value=p[f]||'';});
    form.querySelector('[name="source_file"]').value=p.source_file||''; }
  editImgSrc=(p&&p.image)?p.image:''; renderEditImg();
  document.getElementById('pickList').style.display='none';
  document.getElementById('uploadImgInput').value='';
  document.getElementById('editModal').classList.add('active');
}
function openCreateModal() {
  if(!requireEditAuth()) return;
  state.currentId=null; document.getElementById('editTitle').textContent='新增产品'; buildForm();
  document.getElementById('editForm').reset();
  editImgSrc=''; renderEditImg();
  document.getElementById('pickList').style.display='none';
  document.getElementById('editModal').classList.add('active');
}
function saveProduct() {
  const form=document.getElementById('editForm'); const data={};
  EDIT_FIELDS.forEach(f=>{const el=form.querySelector(`[name="${f}"]`);if(el)data[f]=el.value.trim();});
  data.source_file=form.querySelector('[name="source_file"]').value.trim()||'手动新增';
  data.image=editImgSrc;
  if(!data.product_name&&!data.model){toast('产品名称和型号至少填一个','error');return;}
  // 电机信息同步
  if(data.motor) data.motor_info=data.motor;
  const now=new Date().toISOString().replace('T',' ').substring(0,19);
  if(state.currentId){
    const idx=products.findIndex(x=>x.id===state.currentId);
    if(idx>=0){Object.assign(products[idx],data);products[idx].updated_at=now;}
    toast('更新成功');
  } else {
    products.push({id:nextId++,extra_fields:{},alt_images:[],is_main:true,group_size:1,group_model:'',created_at:now,updated_at:now,...data});
    toast('创建成功');
  }
  saveChanges(); buildChildMap(); closeModal('editModal'); renderSeriesFilter(); renderTable(); updateStats();
}
function deleteProduct(id) {
  if(!requireEditAuth()) return;
  const p=products.find(x=>x.id===id); const name=p?(p.product_name||p.model||id):id;
  if(!confirm(`确定删除「${name}」？此操作不可恢复。`))return;
  products=products.filter(x=>x.id!==id);
  saveChanges(); buildChildMap(); toast('删除成功'); renderSeriesFilter(); renderTable(); updateStats();
}
function importData(event) {
  const file=event.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const imp=JSON.parse(e.target.result);
      if(!Array.isArray(imp))throw new Error('格式错误');
      if(!confirm(`导入 ${imp.length} 条数据？将替换当前所有数据。`))return;
      if(!requireEditAuth()) return;
      products=imp; baseline=JSON.parse(JSON.stringify(imp));
      nextId=Math.max(...products.map(p=>p.id||0),0)+1;
      try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
      buildChildMap(); renderSeriesFilter(); renderTable(); updateStats(); toast('导入成功');
    }catch(err){toast('导入失败：文件格式错误','error');}
  };
  reader.readAsText(file,'UTF-8'); event.target.value='';
}
function resetData(){ if(!confirm('确定重置为原始数据？所有本地修改将丢失。'))return; 
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  idbDel('products').then(()=>{ location.reload(); });
}
function closeModal(id){document.getElementById(id).classList.remove('active');}

document.getElementById('searchInput').addEventListener('input',e=>{
  clearTimeout(window._t); window._t=setTimeout(()=>{state.search=e.target.value;state.page=1;renderTable();},300);});
document.getElementById('searchAllInput').addEventListener('input',e=>{
  clearTimeout(window._t2); window._t2=setTimeout(()=>{state.searchAll=e.target.value;state.page=1;renderTable();},300);});
document.getElementById('seriesFilter').addEventListener('change',e=>{state.series=e.target.value;state.page=1;renderTable();});
document.getElementById('perPageSelect').addEventListener('change',e=>{state.per_page=parseInt(e.target.value);state.page=1;renderTable();});
document.querySelectorAll('.modal-overlay').forEach(m=>{m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('active');});});
</script>
</body>
