<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春凯产品目录参数管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#333}
.header{background:linear-gradient(135deg,#1a5276,#2980b9);color:#fff;padding:18px 24px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:20px;font-weight:600}
.header .sub{font-size:12px;opacity:.8;margin-top:4px}
.toolbar{background:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid #e0e0e0;position:sticky;top:0;z-index:100}
.toolbar input,.toolbar select{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:#2980b9}
.toolbar input[type=text]{flex:1;min-width:200px}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn-primary{background:#2980b9;color:#fff}
.btn-success{background:#27ae60;color:#fff}
.btn-warning{background:#f39c12;color:#fff}
.btn-danger{background:#e74c3c;color:#fff}
.btn-info{background:#16a085;color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.stats{display:flex;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid #eee;flex-wrap:wrap}
.stat-card{background:#f8f9fa;border-radius:8px;padding:10px 18px;text-align:center;min-width:100px}
.stat-card .num{font-size:22px;font-weight:700;color:#2980b9}
.stat-card .label{font-size:11px;color:#888;margin-top:2px}
.table-wrap{padding:16px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:12px}
thead{background:#1a5276;color:#fff;position:sticky;top:0}
th{padding:10px 8px;text-align:left;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{background:#2471a3}
td{padding:8px;border-bottom:1px solid #f0f0f0;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover{background:#f0f7ff}
tr.no-param{background:#fafafa}
tr.no-param td{color:#aaa}
.actions{display:flex;gap:4px}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:12px;width:90%;max-width:700px;max-height:85vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal-header{background:linear-gradient(135deg,#1a5276,#2980b9);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-radius:12px 12px 0 0}
.modal-header h2{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
.modal-body{padding:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none}
.form-group input:focus{border-color:#2980b9}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{padding:14px 20px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:10px}
.pagination{display:flex;justify-content:center;gap:6px;padding:16px}
.pagination button{padding:6px 12px;border:1px solid #ddd;background:#fff;border-radius:4px;cursor:pointer;font-size:12px}
.pagination button.active{background:#2980b9;color:#fff;border-color:#2980b9}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:2000;animation:slideIn .3s;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.toast.success{background:#27ae60}
.toast.error{background:#e74c3c}
.toast.info{background:#2980b9}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty{text-align:center;padding:40px;color:#999}
</style>
</head>
<body>
<div class="header">
  <h1>春凯产品目录参数管理系统</h1>
  <div class="sub">支持增删改查 / 搜索筛选 / 导出CSV / 数据本地保存 | 共 <span id="totalCount">0</span> 款产品</div>
</div>
<div class="toolbar">
  <input type="text" id="searchInput" placeholder="搜索型号、板块、参数..." oninput="renderTable()">
  <select id="sectionFilter" onchange="renderTable()"><option value="">全部板块</option></select>
  <select id="paramFilter" onchange="renderTable()"><option value="">全部状态</option><option value="has">有参数</option><option value="no">无参数</option></select>
  <button class="btn btn-primary" onclick="openAddModal()">+ 新增产品</button>
  <button class="btn btn-success" onclick="exportCSV()">导出CSV</button>
  <button class="btn btn-info" onclick="exportJSON()">导出JSON</button>
  <button class="btn btn-warning" onclick="document.getElementById('importFile').click()">导入JSON</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
  <button class="btn btn-danger" onclick="resetData()">重置数据</button>
</div>
<div class="stats" id="statsBar"></div>
<div class="table-wrap">
  <table id="dataTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
</div>
<div class="pagination" id="pagination"></div>
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header"><h2 id="modalTitle">编辑产品</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer"><button class="btn btn-danger" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveItem()">保存</button></div>
  </div>
</div>

function decodeData(b64) {
  try {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const str = new TextDecoder('utf-8').decode(bytes);
    return JSON.parse(str);
  } catch(e) {
    console.error('数据解码失败:', e);
    return [];
  }
}

const DEFAULT_DATA = decodeData(DATA_B64);
console.log('加载产品数:', DEFAULT_DATA.length);

let data = [];
let currentPage = 1;
const pageSize = 30;
let editingId = null;
let sortField = null;
let sortAsc = true;

function init() {
  const saved = localStorage.getItem('chunkai_products');
  if (saved) {
    try { data = JSON.parse(saved); } catch(e) { data = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  } else {
    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  document.getElementById('totalCount').textContent = data.length;
  const sel = document.getElementById('sectionFilter');
  SECTIONS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  renderTable();
}

function saveData() {
  localStorage.setItem('chunkai_products', JSON.stringify(data));
  document.getElementById('totalCount').textContent = data.length;
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const sec = document.getElementById('sectionFilter').value;
  const pf = document.getElementById('paramFilter').value;
  let filtered = data.filter(item => {
    if (sec && item.section !== sec) return false;
    const hasParam = FIELDS.some(f => item[f] && String(item[f]).trim());
    if (pf === 'has' && !hasParam) return false;
    if (pf === 'no' && hasParam) return false;
    if (q) {
      const searchStr = Object.values(item).join(' ').toLowerCase();
      if (!searchStr.includes(q)) return false;
    }
    return true;
  });
  if (sortField) {
    filtered.sort((a,b) => {
      const va = a[sortField] || '';
      const vb = b[sortField] || '';
      return sortAsc ? String(va).localeCompare(String(vb), 'zh') : String(vb).localeCompare(String(va), 'zh');
    });
  }
  return filtered;
}

function renderStats() {
  const filtered = getFiltered();
  const hasParam = filtered.filter(i => FIELDS.some(f => i[f] && String(i[f]).trim())).length;
  const sections = new Set(filtered.map(i => i.section)).size;
  document.getElementById('statsBar').innerHTML =
    '<div class="stat-card"><div class="num">'+filtered.length+'</div><div class="label">当前筛选</div></div>'+
    '<div class="stat-card"><div class="num">'+data.length+'</div><div class="label">全部产品</div></div>'+
    '<div class="stat-card"><div class="num">'+hasParam+'</div><div class="label">有参数</div></div>'+
    '<div class="stat-card"><div class="num">'+(filtered.length-hasParam)+'</div><div class="label">无参数</div></div>'+
    '<div class="stat-card"><div class="num">'+sections+'</div><div class="label">涉及板块</div></div>';
}

function renderTable() {
  renderStats();
  const filtered = getFiltered();
  const totalPages = Math.ceil(filtered.length / pageSize);
  if (currentPage > totalPages) currentPage = totalPages || 1;
  const start = (currentPage - 1) * pageSize;
  const pageData = filtered.slice(start, start + pageSize);
  const thead = document.getElementById('tableHead');
  let headHtml = '<tr><th onclick="sortBy(\'id\')">序号</th><th onclick="sortBy(\'section\')">板块</th><th onclick="sortBy(\'model\')">型号</th><th onclick="sortBy(\'pages\')">页码</th>';
  FIELDS.forEach(f => { headHtml += '<th onclick="sortBy(\''+f+'\')" title="'+f+'">'+f+'</th>'; });
  headHtml += '<th>操作</th></tr>';
  thead.innerHTML = headHtml;
  const tbody = document.getElementById('tableBody');
  if (pageData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="'+(5+FIELDS.length)+'" class="empty">没有匹配的数据</td></tr>';
  } else {
    tbody.innerHTML = pageData.map(item => {
      const hasParam = FIELDS.some(f => item[f] && String(item[f]).trim());
      const cls = hasParam ? '' : 'no-param';
      let cells = '<td>'+item.id+'</td><td title="'+item.section+'">'+item.section+'</td><td><strong>'+item.model+'</strong></td><td>'+item.pages+'</td>';
      FIELDS.forEach(f => {
        const val = item[f] || '';
        cells += '<td title="'+val+'">'+val+'</td>';
      });
      cells += '<td><div class="actions"><button class="btn btn-sm btn-primary" onclick="openEditModal('+item.id+')">编辑</button><button class="btn btn-sm btn-danger" onclick="deleteItem('+item.id+')">删除</button></div></td>';
      return '<tr class="'+cls+'">'+cells+'</tr>';
    }).join('');
  }
  const pag = document.getElementById('pagination');
  if (totalPages > 1) {
    let pagHtml = '<button onclick="goPage('+(currentPage-1)+')" '+(currentPage<=1?'disabled':'')+'>上一页</button>';
    const maxShow = 7;
    let startP = Math.max(1, currentPage - 3);
    let endP = Math.min(totalPages, startP + maxShow - 1);
    if (endP - startP < maxShow - 1) startP = Math.max(1, endP - maxShow + 1);
    for (let i = startP; i <= endP; i++) {
      pagHtml += '<button class="'+(i===currentPage?'active':'')+'" onclick="goPage('+i+')">'+i+'</button>';
    }
    pagHtml += '<button onclick="goPage('+(currentPage+1)+')" '+(currentPage>=totalPages?'disabled':'')+'>下一页</button>';
    pag.innerHTML = pagHtml;
  } else { pag.innerHTML = ''; }
}

function sortBy(field) {
  if (sortField === field) sortAsc = !sortAsc;
  else { sortField = field; sortAsc = true; }
  renderTable();
}
function goPage(p) { currentPage = p; renderTable(); }

function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '新增产品';
  const newItem = {};
  FIELDS.forEach(f => newItem[f] = '');
  newItem.section = SECTIONS[0];
  newItem.model = '';
  newItem.pages = '';
  renderModalForm(newItem);
  document.getElementById('editModal').classList.add('active');
}

function openEditModal(id) {
  const item = data.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '编辑产品 - ' + item.model;
  renderModalForm(item);
  document.getElementById('editModal').classList.add('active');
}

function renderModalForm(item) {
  const body = document.getElementById('modalBody');
  let html = '<div class="form-row"><div class="form-group"><label>型号 *</label><input type="text" id="f_model" value="'+(item.model||'')+'"></div><div class="form-group"><label>所属板块</label><select id="f_section">';
  SECTIONS.forEach(s => { html += '<option value="'+s+'" '+(item.section===s?'selected':'')+'>'+s+'</option>'; });
  html += '</select></div></div><div class="form-group"><label>所在页码</label><input type="text" id="f_pages" value="'+(item.pages||'')+'" placeholder="如 13,14"></div>';
  FIELDS.forEach((f, idx) => {
    if (idx % 2 === 0) html += '<div class="form-row">';
    const val = (item[f]||'').toString().replace(/"/g,'&quot;');
    html += '<div class="form-group"><label>'+f+'</label><input type="text" id="f_'+idx+'" value="'+val+'"></div>';
    if (idx % 2 === 1 || idx === FIELDS.length - 1) html += '</div>';
  });
  body.innerHTML = html;
}

function saveItem() {
  const model = document.getElementById('f_model').value.trim();
  if (!model) { showToast('型号不能为空', 'error'); return; }
  const section = document.getElementById('f_section').value;
  const pages = document.getElementById('f_pages').value.trim();
  const values = {};
  FIELDS.forEach((f, idx) => { values[f] = document.getElementById('f_'+idx).value.trim(); });
  if (editingId) {
    const item = data.find(i => i.id === editingId);
    if (item) { Object.assign(item, {model, section, pages}, values); }
    showToast('修改成功', 'success');
  } else {
    const newId = data.length > 0 ? Math.max.apply(null, data.map(i=>i.id)) + 1 : 1;
    data.push({id:newId, model, section, pages});
    Object.assign(data[data.length-1], values);
    showToast('新增成功', 'success');
  }
  saveData();
  closeModal();
  renderTable();
}

function deleteItem(id) {
  const item = data.find(i => i.id === id);
  if (!item) return;
  if (!confirm('确定删除产品「'+item.model+'」吗？此操作不可撤销。')) return;
  data = data.filter(i => i.id !== id);
  saveData();
  renderTable();
  showToast('删除成功', 'success');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('active');
  editingId = null;
}

function exportCSV() {
  const filtered = getFiltered();
  const headers = ['序号','板块','型号','页码'].concat(FIELDS);
  const rows = filtered.map(item => [item.id, item.section, item.model, item.pages].concat(FIELDS.map(f => item[f]||'')));
  const csv = [headers].concat(rows).map(row => row.map(cell => '"'+String(cell).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '春凯产品目录参数_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  showToast('导出成功', 'success');
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '春凯产品目录参数_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  showToast('导出成功', 'success');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error('格式错误');
      if (!confirm('确定导入 '+imported.length+' 条数据吗？将覆盖当前数据。')) return;
      data = imported;
      saveData();
      renderTable();
      showToast('导入成功', 'success');
    } catch(err) {
      showToast('导入失败：'+err.message, 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetData() {
  if (!confirm('确定重置为初始数据吗？当前所有修改将丢失！')) return;
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData();
  renderTable();
  showToast('已重置为初始数据', 'info');
}

function showToast(msg, type) {
  type = type || 'info';
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

document.getElementById('editModal').addEventListener('click', e => {
  if (e.target.id === 'editModal') closeModal();
});

init();
</script>
</body>
</html>
