<html lang="zh-CN">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

    color: #1a1a2e;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
    color: #16213e;
  }
  .subtitle {
    text-align: center;
    color: #8892a6;
    font-size: 14px;
    margin-bottom: 32px;
  }
  .search-box {
    position: relative;
    margin-bottom: 24px;
  }
  .search-box input {
    width: 100%;
    padding: 16px 20px 16px 52px;
    font-size: 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    background: #fff;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box input:focus {
    border-color: #4a90d9;
    box-shadow: 0 0 0 3px rgba(74,144,217,0.12);
  }
  .search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: #a0aec0;
  }
  .result-card {
    background: #fff;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    margin-bottom: 20px;
    display: none;
  }
  .result-card.show { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .result-country {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
    color: #16213e;
  }
  .result-country-en {
    font-size: 13px;
    color: #8892a6;
    margin-bottom: 20px;
  }
  .result-section { margin-bottom: 16px; }
  .result-section:last-child { margin-bottom: 0; }
  .result-label {
    font-size: 12px;
    color: #8892a6;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .result-value {
    font-size: 15px;
    font-weight: 600;
    color: #2d3748;
  }
  .region-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  .region-west { background: #e8f4fd; color: #2b6cb0; }
  .region-east { background: #fef3e8; color: #c05621; }
  .region-south { background: #edf7ee; color: #2f855a; }
  .staff-list { display: flex; flex-direction: column; gap: 10px; }
  .staff-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: #f7fafc;
    border-radius: 8px;
  }
  .staff-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    flex-shrink: 0;
  }
  .staff-info { flex: 1; }
  .staff-name { font-size: 14px; font-weight: 600; color: #2d3748; }
  .staff-role { font-size: 12px; color: #8892a6; }
  .staff-email {
    font-size: 13px;
    color: #4a90d9;
    text-decoration: none;
  }
  .staff-email:hover { text-decoration: underline; }
  .no-result {
    text-align: center;
    padding: 40px 20px;
    color: #a0aec0;
    display: none;
  }
  .no-result.show { display: block; }
  .no-result-icon { font-size: 40px; margin-bottom: 12px; }
  .no-result-text { font-size: 14px; }
  .browse-section {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .browse-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    color: #16213e;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .region-group { margin-bottom: 20px; }
  .region-group:last-child { margin-bottom: 0; }
  .region-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    user-select: none;
  }
  .region-header:hover { opacity: 0.8; }
  .region-chevron {
    width: 16px;
    height: 16px;
    transition: transform 0.2s;
    color: #a0aec0;
  }
  .region-group.collapsed .region-chevron { transform: rotate(-90deg); }
  .region-group.collapsed .country-chips { display: none; }
  .region-staff {
    font-size: 12px;
    color: #8892a6;
    margin-left: auto;
  }
  .country-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .country-chip {
    padding: 4px 10px;
    background: #f0f4f8;
    border-radius: 6px;
    font-size: 12px;
    color: #4a5568;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .country-chip:hover {
    background: #4a90d9;
    color: #fff;
  }
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 12px;
    color: #b0b8c4;
  }
  .back-home {
    display: inline-block;
    margin-bottom: 20px;
    color: #4a90d9;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  .back-home:hover { text-decoration: underline; }
</style>

  <div class="no-result" id="noResult">

// ===== 构建扁平化搜索索引 =====
const allCountries = [];
regions.forEach(region => {
  region.countries.forEach(country => {
    allCountries.push({
      zh: country.zh,
      en: country.en,
      region: region
    });
  });
});

// ===== 搜索功能 =====
const searchInput = document.getElementById('searchInput');
const resultCard = document.getElementById('resultCard');
const noResult = document.getElementById('noResult');

function search(query) {
  query = query.trim().toLowerCase();
  if (!query) {
    resultCard.classList.remove('show');
    noResult.classList.remove('show');
    return;
  }

  const match = allCountries.find(c => {
    if (c.zh.toLowerCase().includes(query)) return true;
    return c.en.some(name => name.toLowerCase().includes(query));
  });

  if (match) {
    showResult(match);
  } else {
    resultCard.classList.remove('show');
    noResult.classList.add('show');
  }
}

function showResult(country) {
  noResult.classList.remove('show');
  const region = country.region;

  const staffHtml = region.staff.map(s => `
    <div class="staff-item">
      <div class="staff-avatar" style="background:${s.color}">${s.name.charAt(0)}</div>
      <div class="staff-info">
        <div class="staff-name">${s.name} <span style="font-weight:400;color:#8892a6;font-size:12px">${s.role}</span></div>
        <a class="staff-email" href="mailto:${s.email}">${s.email}</a>
      </div>
    </div>
  `).join('');

  resultCard.innerHTML = `
    <div class="result-country">${country.zh}</div>
    <div class="result-country-en">${country.en.join(' / ')}</div>
    <div class="result-section">
      <div class="result-label">所属大区</div>
      <span class="region-tag ${region.tagClass}">${region.name}</span>
    </div>
    <div class="result-section">
      <div class="result-label">负责业务员</div>
      <div class="staff-list">${staffHtml}</div>
    </div>
  `;
  resultCard.classList.add('show');
}

searchInput.addEventListener('input', e => search(e.target.value));

// ===== 浏览列表渲染 =====
const browseList = document.getElementById('browseList');

regions.forEach(region => {
  const group = document.createElement('div');
  group.className = 'region-group';

  const staffNames = region.staff.map(s => s.name).join('、');

  group.innerHTML = `
    <div class="region-header">
      <svg class="region-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      <span class="region-tag ${region.tagClass}">${region.name}</span>
      <span class="region-staff">${region.countries.length}个国家 · ${staffNames}</span>
    </div>
    <div class="country-chips">
      ${region.countries.map(c => `<span class="country-chip" data-zh="${c.zh}">${c.zh}</span>`).join('')}
    </div>
  `;

  group.querySelector('.region-header').addEventListener('click', () => {
    group.classList.toggle('collapsed');
  });

  group.querySelectorAll('.country-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      searchInput.value = chip.dataset.zh;
      search(chip.dataset.zh);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  browseList.appendChild(group);
});
</script>
</body>
</html>
