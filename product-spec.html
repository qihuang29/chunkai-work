<body>

<div class="header">
  <h1>春凯电器 · 产品规格书管理系统</h1>
  <div class="stats" id="headerStats">加载中...</div>
  <div class="actions">
    <button class="btn btn-warn btn-sm" onclick="exportData()">导出数据</button>
    <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">导入数据</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-outline btn-sm" onclick="resetData()">重置数据</button>
  </div>
</div>

<div class="container">
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索产品名称 / 型号 / 备注...">
    <select id="seriesFilter"><option value="">全部系列</option></select>
    <select id="perPageSelect">
      <option value="20">20条/页</option>
      <option value="50" selected>50条/页</option>
      <option value="100">100条/页</option>
      <option value="200">200条/页</option>
    </select>
    <button class="btn btn-primary" onclick="openCreateModal()">+ 新增产品</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('id')">ID</th>
          <th onclick="sortBy('series')">系列</th>
          <th onclick="sortBy('product_name')">产品名称</th>
          <th onclick="sortBy('model')">型号</th>
          <th>电压</th>
          <th>功率</th>
          <th>转速</th>
          <th>净重</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">产品详情</h2>
      <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('detailModal')">关闭</button>
      <button class="btn btn-primary" onclick="editFromDetail()">编辑</button>
    </div>
  </div>
</div>

<!-- 编辑/新增弹窗 -->
<div class="modal-overlay" id="editModal">

    <div class="modal-header">
      <h2 id="editTitle">编辑产品</h2>

      <button class="btn btn-success" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

function getSeriesList() {
  const set = new Set();
  products.forEach(p => { if(p.series) set.add(p.series); });
  return Array.from(set).sort();
}

// ============ 状态 ============
let state = { page:1, per_page:50, search:'', series:'', sort:'id', order:'asc', currentId:null };

// ============ 工具 ============
function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

function esc(s) {
  if(s === null || s === undefined) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// ============ 渲染 ============
function updateStats() {
  const seriesCount = new Set(products.map(p=>p.series).filter(Boolean)).size;
  const hasChanges = localStorage.getItem(STORAGE_KEY) !== null;
  document.getElementById('headerStats').innerHTML =
    `共 ${products.length} 条产品 · ${seriesCount} 个系列` +
    (hasChanges ? '<span class="badge">已修改</span>' : '');
}

function renderSeriesFilter() {
  const sel = document.getElementById('seriesFilter');
  const current = sel.value;
  const list = getSeriesList();
  sel.innerHTML = '<option value="">全部系列</option>' +
    list.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  sel.value = current;
}

function getFiltered() {
  let list = products.slice();
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(p =>
      (p.product_name||'').toLowerCase().includes(q) ||
      (p.model||'').toLowerCase().includes(q) ||
      (p.remark||'').toLowerCase().includes(q) ||
      (p.source_file||'').toLowerCase().includes(q) ||
      (p.series||'').toLowerCase().includes(q)
    );
  }
  if (state.series) {
    list = list.filter(p => p.series === state.series);
  }
  // 排序
  const col = state.sort;
  list.sort((a,b) => {
    let va = a[col] || '', vb = b[col] || '';
    if (col === 'id') { va = Number(va)||0; vb = Number(vb)||0; }
    if (va < vb) return state.order === 'asc' ? -1 : 1;
    if (va > vb) return state.order === 'asc' ? 1 : -1;
    return 0;
  });
  return list;
}

function renderTable() {
  const filtered = getFiltered();
  const total = filtered.length;
  const pages = Math.ceil(total / state.per_page);
  if (state.page > pages && pages > 0) state.page = pages;
  const start = (state.page - 1) * state.per_page;
  const pageData = filtered.slice(start, start + state.per_page);

  const tbody = document.getElementById('tableBody');
  if (pageData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">暂无数据</td></tr>';
  } else {
    tbody.innerHTML = pageData.map(p => `
      <tr>
        <td>${p.id}</td>
        <td><span class="series-tag">${esc(p.series||'')}</span></td>
        <td>${esc(p.product_name||'')}<div class="source-file">${esc(p.source_file||'')}</div></td>
        <td class="model-cell">${esc(p.model||'')}</td>
        <td>${esc(p.voltage||'')}</td>
        <td>${esc(p.power||'')}</td>
        <td>${esc(p.rpm||'')}</td>
        <td>${esc(p.net_weight||'')}</td>
        <td class="actions-cell">
          <button class="btn btn-outline btn-sm" onclick="viewDetail(${p.id})">查看</button>
          <button class="btn btn-primary btn-sm" onclick="openEditModal(${p.id})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">删除</button>
        </td>
      </tr>
    `).join('');
  }
  renderPagination(total, pages);
}

function renderPagination(total, pages) {
  const el = document.getElementById('pagination');
  let html = `<span class="info">共 ${total} 条，第 ${state.page}/${pages||1} 页</span>`;
  html += `<button onclick="goPage(1)" ${state.page<=1?'disabled':''}>首页</button>`;
  html += `<button onclick="goPage(${state.page-1})" ${state.page<=1?'disabled':''}>上一页</button>`;
  const start = Math.max(1, state.page-3), end = Math.min(pages, state.page+3);
  for (let i=start; i<=end; i++) {
    html += `<button class="${i===state.page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button onclick="goPage(${state.page+1})" ${state.page>=pages?'disabled':''}>下一页</button>`;
  html += `<button onclick="goPage(${pages})" ${state.page>=pages?'disabled':''}>末页</button>`;
  el.innerHTML = html;
}

function goPage(p) { state.page = p; renderTable(); }
function sortBy(col) {
  if (state.sort === col) state.order = state.order==='asc'?'desc':'asc';
  else { state.sort = col; state.order = 'asc'; }
  renderTable();
}

// ============ 详情 ============
function viewDetail(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  state.currentId = id;
  document.getElementById('detailTitle').textContent = p.product_name || '产品详情';

  const sections = [
    { title:'基本信息', fields:['series','product_name','model','voltage','speed_levels','power','rpm','wind_speed','noise','temperature_rise','timer','operation_mode','oscillation_angle','tilt_angle','oscillation_tilt','color'] },
    { title:'尺寸与重量', fields:['product_size','package_size','carton_size','net_weight','gross_weight'] },
    { title:'装柜与配件', fields:['container_40hq','container_40gp','container_20gp','motor','blade','blade_guard','max_airflow','standby_power','charge_time','discharge_time','battery','height_adjustable','oscillation_freq','guide_wheel_control'] },
    { title:'认证信息', fields:['cert_ce','cert_cb','cert_gs','cert_saa','cert_ul','cert_etl','cert_rohs','cert_other'] },
  ];

  let html = '';
  sections.forEach(sec => {
    const items = sec.fields.filter(f => p[f] !== undefined && p[f] !== null && p[f] !== '');
    if (items.length > 0) {
      html += `<div class="section-title">${sec.title}</div><div class="detail-grid">`;
      items.forEach(f => {
        html += `<div class="detail-item"><div class="label">${FIELD_LABELS[f]||f}</div><div class="value">${esc(p[f])}</div></div>`;
      });
      html += '</div>';
    }
  });

  if (p.remark) {
    html += `<div class="section-title">备注</div><div style="padding:10px 14px;font-size:14px;line-height:1.6;">${esc(p.remark)}</div>`;
  }

  if (p.extra_fields && Object.keys(p.extra_fields).length > 0) {
    html += '<div class="section-title">其他字段</div><div class="detail-grid">';
    Object.entries(p.extra_fields).forEach(([k,v]) => {
      if (v) html += `<div class="detail-item"><div class="label">${esc(k)}</div><div class="value">${esc(v)}</div></div>`;
    });
    html += '</div>';
  }

  html += `<div class="section-title">元数据</div><div class="detail-grid">
    <div class="detail-item"><div class="label">来源文件</div><div class="value">${esc(p.source_file||'')}</div></div>
    <div class="detail-item"><div class="label">创建时间</div><div class="value">${esc(p.created_at||'')}</div></div>
    <div class="detail-item"><div class="label">更新时间</div><div class="value">${esc(p.updated_at||'')}</div></div>
  </div>`;

  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('detailModal').classList.add('active');
}

function editFromDetail() {
  closeModal('detailModal');
  openEditModal(state.currentId);
}

// ============ 编辑/新增 ============
function buildForm() {
  const form = document.getElementById('editForm');
  form.innerHTML = EDIT_FIELDS.map(f => {
    const label = FIELD_LABELS[f] || f;
    if (f === 'series') {
      const seriesList = getSeriesList();
      return `<div class="form-group"><label>${label}</label><select name="series"><option value="">请选择</option>${seriesList.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>`;
    }
    if (f === 'remark') {
      return `<div class="form-group full"><label>${label}</label><textarea name="${f}"></textarea></div>`;
    }
    return `<div class="form-group"><label>${label}</label><input type="text" name="${f}"></div>`;
  }).join('') + `<div class="form-group full"><label>来源文件</label><input type="text" name="source_file"></div>`;
}

function openEditModal(id) {
  state.currentId = id;
  document.getElementById('editTitle').textContent = '编辑产品';
  buildForm();
  const p = products.find(x => x.id === id);
  if (p) {
    const form = document.getElementById('editForm');
    EDIT_FIELDS.forEach(f => {
      const el = form.querySelector(`[name="${f}"]`);
      if (el) el.value = p[f] || '';
    });
    form.querySelector('[name="source_file"]').value = p.source_file || '';
  }
  document.getElementById('editModal').classList.add('active');
}

function openCreateModal() {
  state.currentId = null;
  document.getElementById('editTitle').textContent = '新增产品';
  buildForm();
  document.getElementById('editForm').reset();
  document.getElementById('editModal').classList.add('active');
}

function saveProduct() {
  const form = document.getElementById('editForm');
  const data = {};
  EDIT_FIELDS.forEach(f => {
    const el = form.querySelector(`[name="${f}"]`);
    if (el) data[f] = el.value.trim();
  });
  data.source_file = form.querySelector('[name="source_file"]').value.trim() || '手动新增';

  if (!data.product_name && !data.model) {
    toast('产品名称和型号至少填一个', 'error');
    return;
  }

  const now = new Date().toISOString().replace('T',' ').substring(0,19);

  if (state.currentId) {
    const idx = products.findIndex(x => x.id === state.currentId);
    if (idx >= 0) {
      Object.assign(products[idx], data);
      products[idx].updated_at = now;
    }
    toast('更新成功');
  } else {
    const newProduct = { id: nextId++, extra_fields: {}, created_at: now, updated_at: now, ...data };
    products.push(newProduct);
    toast('创建成功');
  }

  saveChanges();
  closeModal('editModal');
  renderSeriesFilter();
  renderTable();
  updateStats();
}

function deleteProduct(id) {
  const p = products.find(x => x.id === id);
  const name = p ? (p.product_name || p.model || id) : id;
  if (!confirm(`确定删除「${name}」？此操作不可恢复。`)) return;
  products = products.filter(x => x.id !== id);
  saveChanges();
  toast('删除成功');
  renderSeriesFilter();
  renderTable();
  updateStats();
}

// ============ 导入导出 ============
function exportData() {
  const blob = new Blob([JSON.stringify(products, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '产品规格书数据_' + new Date().toISOString().substring(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('数据已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error('格式错误');
      if (!confirm(`导入 ${imported.length} 条数据？将替换当前所有数据。`)) return;
      products = imported;
      nextId = Math.max(...products.map(p=>p.id||0), 0) + 1;
      saveChanges();
      renderSeriesFilter();
      renderTable();
      updateStats();
      toast('导入成功');
    } catch(err) {
      toast('导入失败：文件格式错误', 'error');
    }
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = '';
}

function resetData() {
  if (!confirm('确定重置为原始数据？所有本地修改将丢失。')) return;
  localStorage.removeItem(STORAGE_KEY);
  loadChanges();
  renderSeriesFilter();
  renderTable();
  updateStats();
  toast('已重置为原始数据');
}

// ============ 通用 ============
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// 事件绑定
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(window._searchTimer);
  window._searchTimer = setTimeout(() => { state.search = e.target.value; state.page=1; renderTable(); }, 300);
});
document.getElementById('seriesFilter').addEventListener('change', e => { state.series = e.target.value; state.page=1; renderTable(); });
document.getElementById('perPageSelect').addEventListener('change', e => { state.per_page = parseInt(e.target.value); state.page=1; renderTable(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); });
});

// 初始化
loadChanges();
renderSeriesFilter();
renderTable();
updateStats();
</script>
</body>
</html>
