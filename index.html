<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春凯工作台 · Chunkai Workspace</title>
<style>
:root{
  --bg:#0b1014; --ink:#e8f1ec; --muted:#8aa099;
  --accent:#7fd8a4; --accent2:#4fb985; --line:rgba(127,216,164,.14);
  --card:rgba(255,255,255,.035);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.6;overflow-x:hidden}
::selection{background:var(--accent);color:#06281a}

#glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(127,216,164,.12) 0%,transparent 70%);transform:translate(-50%,-50%)}
#stars{position:fixed;inset:0;z-index:0;opacity:.4}

.wrap{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:0 28px}

nav{position:fixed;top:0;left:0;right:0;z-index:10;backdrop-filter:blur(12px);background:rgba(11,16,20,.6);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:800;letter-spacing:3px;font-size:16px}
.logo span{color:var(--accent)}
nav .tag{color:var(--muted);font-size:12px}

main{padding:160px 0 90px}
.kicker{color:var(--accent);letter-spacing:5px;font-size:12px;text-transform:uppercase;margin-bottom:20px}
h1{font-size:clamp(34px,6vw,60px);font-weight:800;letter-spacing:-.5px;line-height:1.12}
h1 .grad{background:linear-gradient(120deg,#fff 25%,var(--accent) 65%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:22px 0 60px;font-size:16px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.sys{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 26px;transition:transform .3s,border-color .3s;transform-style:preserve-3d}
.sys:hover{border-color:rgba(127,216,164,.45)}
.sys .ic{font-size:26px;display:block;margin-bottom:14px}
.sys h3{font-size:18px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.sys p{color:var(--muted);font-size:13.5px}
.badge{font-size:11px;padding:2px 9px;border-radius:100px;background:rgba(127,216,164,.15);color:var(--accent);font-weight:600}
.badge.old{background:rgba(255,255,255,.08);color:var(--muted)}
.sys .go{color:var(--accent);font-size:13px;font-weight:600;margin-top:14px;display:inline-block}

footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:12px;text-align:center;position:relative;z-index:2}

.rv{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="glow"></div>
<canvas id="stars"></canvas>

<nav>
  <div class="wrap">
    <div class="logo">CHUN<span>KAI</span></div>
    <div class="tag">内部工作台</div>
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="kicker">Workspaces</div>
    <h1>春凯工作台</h1>
    <p class="sub">选择要进入的系统。</p>
    <div class="grid">
      <a class="sys rv tilt" href="product-spec.html">
        <span class="ic">📋</span>
        <h3>产品规格书系统 <span class="badge">V4</span></h3>
        <p>540 个型号。电压、功率、装柜量（20GP/40GP/40HQ）、电机等全字段检索，可增删改查。</p>
        <span class="go">进入 →</span>
      </a>
      <a class="sys rv tilt" href="product-catalog.html">
        <span class="ic">📂</span>
        <h3>产品目录参数管理</h3>
        <p>产品目录参数维护与查询。</p>
        <span class="go">进入 →</span>
      </a>
      <a class="sys rv tilt" href="country-sales.html">
        <span class="ic">🌍</span>
        <h3>国家业务员查询</h3>
        <p>按国家查对应业务员。</p>
        <span class="go">进入 →</span>
      </a>
      <a class="sys rv tilt" href="Chunkai-Product-Specification-Management-System.html">
        <span class="ic">🗄️</span>
        <h3>旧版规格书系统 <span class="badge old">旧版</span></h3>
        <p>历史版本，仅作存档。</p>
        <span class="go">查看 →</span>
      </a>
    </div>
  </div>
</main>

<footer>© ChunKai Electronics · 内部使用</footer>

<script>
const glow=document.getElementById('glow');
let gx=innerWidth/2,gy=innerHeight/2,cx=gx,cy=gy;
addEventListener('mousemove',e=>{gx=e.clientX;gy=e.clientY;});
(function loop(){cx+=(gx-cx)*.12;cy+=(gy-cy)*.12;glow.style.left=cx+'px';glow.style.top=cy+'px';requestAnimationFrame(loop);})();

const cv=document.getElementById('stars'),ctx=cv.getContext('2d');
let ps=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;ps=Array.from({length:Math.min(60,innerWidth/24)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.5+.4,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}));}
rs();addEventListener('resize',rs);
(function draw(){ctx.clearRect(0,0,cv.width,cv.height);
ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;
ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle='rgba(127,216,164,.5)';ctx.fill();});requestAnimationFrame(draw);})();

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');}),{threshold:.12});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));

document.querySelectorAll('.tilt').forEach(c=>{
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;c.style.transform=`perspective(700px) rotateY(${dx/24}deg) rotateX(${-dy/24}deg) translateY(-3px)`;});
c.addEventListener('mouseleave',()=>c.style.transform='');});
</script>
</body>
</html>
