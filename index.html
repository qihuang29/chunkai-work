<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春凯工作仓库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    min-height: 100vh;
    padding: 60px 20px;
  }
  .container { max-width: 960px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 56px; }
  .header h1 {
    font-size: 2.4rem;
    font-weight: 800;
    background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .header .subtitle {
    color: #94a3b8;
    font-size: 1rem;
  }
  .header .badge {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 18px;
    border-radius: 20px;
    background: rgba(56, 189, 248, 0.1);
    color: #38bdf8;
    font-size: 0.85rem;
    border: 1px solid rgba(56, 189, 248, 0.2);
  }
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    margin-bottom: 48px;
  }
  .tool-card {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: 16px;
    padding: 32px 28px;
    text-decoration: none;
    color: inherit;
    transition: all 0.25s ease;
    display: block;
    position: relative;
    overflow: hidden;
  }
  .tool-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    opacity: 0;
    transition: opacity 0.25s;
  }
  .tool-card:hover {
    transform: translateY(-4px);
    border-color: rgba(56, 189, 248, 0.3);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
  }
  .tool-card:hover::before { opacity: 1; }
  .tool-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    margin-bottom: 20px;
  }
  .tool-icon.blue { background: rgba(56, 189, 248, 0.12); }
  .tool-icon.green { background: rgba(52, 211, 153, 0.12); }
  .tool-icon.orange { background: rgba(251, 146, 60, 0.12); }
  .tool-card h2 {
    font-size: 1.25rem;
    font-weight: 700;
    color: #f1f5f9;
    margin-bottom: 10px;
  }
  .tool-card p {
    font-size: 0.9rem;
    color: #94a3b8;
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .tool-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.88rem;
    font-weight: 600;
    color: #38bdf8;
  }
  .tool-link svg { transition: transform 0.2s; }
  .tool-card:hover .tool-link svg { transform: translateX(4px); }
  .status-tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 600;
    margin-left: 8px;
    vertical-align: middle;
  }
  .status-ready { background: rgba(52, 211, 153, 0.15); color: #34d399; }
  .status-pending { background: rgba(251, 146, 60, 0.15); color: #fb923c; }
  .footer {
    text-align: center;
    color: #475569;
    font-size: 0.8rem;
    padding-top: 32px;
    border-top: 1px solid rgba(148, 163, 184, 0.08);
  }
  .backup-note {
    text-align: center;
    color: #64748b;
    font-size: 0.78rem;
    margin-top: -24px;
    margin-bottom: 32px;
  }
  .backup-note a {
    color: #64748b;
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>春凯工作仓库</h1>
    <p class="subtitle">CHUNKAI Workspace · 外贸业务工具集</p>
    <span class="badge">📦 3 个工作工具 · 持续更新中</span>
  </div>

  <div class="tools-grid">

    <a href="Chunkai-Product-Specification-Management-System.html" class="tool-card">
      <div class="tool-icon blue">📋</div>
      <h2>产品规格书管理系统 <span class="status-tag status-ready">已上线</span></h2>
      <p>春凯全系列产品规格参数查询与管理，涵盖风扇、暖风机、净化器等品类的详细技术规格。</p>
      <span class="tool-link">
        打开工具
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </span>
    </a>

    <a href="country-sales.html" class="tool-card">
      <div class="tool-icon green">🌍</div>
      <h2>国家业务员查询工具 <span class="status-tag status-ready">已上线</span></h2>
      <p>输入国家中文名或英文名，快速查询该国家所属大区及对应负责业务员、联系方式。</p>
      <span class="tool-link">
        打开工具
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </span>
    </a>

    <a href="product-catalog.html" class="tool-card">
      <div class="tool-icon orange">📚</div>
      <h2>产品目录查询 <span class="status-tag status-ready">已上线</span></h2>
      <p>春凯产品目录快速检索，按品类、型号浏览产品信息，支持关键词搜索与分类筛选。</p>
      <span class="tool-link">
        打开工具
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </span>
    </a>

  </div>

  <div class="backup-note">
    产品规格书管理系统旧版备份：<a href="product-spec.html">product-spec.html</a>
  </div>

  <div class="footer">
    春凯电器 · 工作工具仓库 · 内部使用
  </div>

</div>
</body>
</html>
